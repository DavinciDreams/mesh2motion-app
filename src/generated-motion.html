<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generated Motion Lab</title>
    <link rel="icon" type="image/png" href="./images/favicon.png">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link href="./styles.css" rel="stylesheet" crossorigin="anonymous">
    <style>
      html {
        width: 100%;
        height: 100%;
      }

      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body > canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 0;
        display: block;
      }

      #toolbar,
      #procedural-controls {
        position: fixed;
        z-index: 2;
        box-sizing: border-box;
        background: color-mix(in srgb, var(--bg-primary) 88%, transparent);
        border: 1px solid var(--bg-tertiary);
        box-shadow: 3px 3px 6px var(--button-shadow-color);
        backdrop-filter: blur(12px);
      }

      #toolbar {
        top: calc(var(--navigation-height) + 1rem);
        left: 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        width: min(700px, calc(100vw - 32px));
        max-height: calc(100vh - 12rem);
        overflow-y: auto;
        padding: 10px;
        border-radius: 6px;
      }

      #procedural-controls {
        bottom: 16px;
        display: grid;
        grid-template-columns: repeat(5, minmax(92px, 1fr));
        gap: 8px;
        width: min(680px, calc(100vw - 32px));
        padding: 10px;
        border-radius: 6px;
      }

      #skeleton-adjust-panel,
      #map-panel,
      #chain-panel {
        position: fixed;
        z-index: 2;
        box-sizing: border-box;
        padding: 10px;
        background: color-mix(in srgb, var(--bg-primary) 90%, transparent);
        border: 1px solid var(--bg-tertiary);
        border-radius: 6px;
        box-shadow: 3px 3px 6px var(--button-shadow-color);
        backdrop-filter: blur(12px);
      }

      #skeleton-adjust-panel {
        right: 16px;
        top: calc(var(--navigation-height) + 1rem);
        display: grid;
        gap: 8px;
        width: min(300px, calc(100vw - 32px));
      }

      #skeleton-adjust-panel[hidden] {
        display: none;
      }

      #skeleton-adjust-panel h2,
      #map-panel h2,
      #chain-panel h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 700;
      }

      #skeleton-adjust-panel label {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 8px;
        padding: 0;
        font-size: 12px;
      }

      #skeleton-adjust-panel input {
        width: 100%;
        box-sizing: border-box;
      }

      #procedural-controls label {
        display: grid;
        gap: 4px;
        padding: 0;
        font-size: 11px;
      }

      #procedural-controls input,
      #procedural-controls select {
        width: 100%;
        box-sizing: border-box;
      }

      #toolbar button,
      #skeleton-adjust-panel button,
      .file-button {
        min-height: 34px;
        padding: 7px 10px;
        background: linear-gradient(0deg, var(--bg-alternate) 0%, var(--bg-tertiary) 100%);
        border: 0;
        border-radius: 3px;
        box-shadow: 2px 2px 3px var(--button-shadow-color);
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      #toolbar button:hover,
      #skeleton-adjust-panel button:hover,
      .file-button:hover {
        background: var(--bg-alternate);
        transform: scale(1.03);
      }

      select {
        max-width: 190px;
        min-height: 34px;
        padding: 7px 10px;
        background: var(--bg-primary);
        border: 1px solid var(--bg-tertiary);
        border-radius: 3px;
      }

      button.active {
        background: var(--button-primary-bg);
      }

      label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 0 0 4px;
        white-space: nowrap;
      }

      #status {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 2;
        max-width: min(360px, calc(100vw - 32px));
        padding: 8px 10px;
        background: color-mix(in srgb, var(--bg-primary) 88%, transparent);
        border: 1px solid var(--bg-tertiary);
        border-radius: 6px;
        box-shadow: 2px 2px 4px var(--button-shadow-color);
      }

      #bone-tooltip {
        position: fixed;
        z-index: 3;
        display: none;
        pointer-events: none;
        padding: 6px 8px;
        background: var(--bg-primary);
        border: 1px solid var(--bg-tertiary);
        border-radius: 6px;
        font-size: 12px;
        white-space: nowrap;
      }

      #map-panel {
        top: calc(var(--navigation-height) + 1rem);
        width: min(420px, calc(100vw - 32px));
        max-height: calc(100vh - 310px);
        overflow: auto;
        right: 16px;
        display: none;
      }

      #chain-panel {
        right: 16px;
        bottom: 16px;
        width: min(420px, calc(100vw - 32px));
        max-height: 210px;
        overflow: auto;
        display: none;
      }

      #chain-list {
        display: grid;
        gap: 6px;
        padding: 0;
      }

      .chain-item {
        padding: 6px;
        border-top: 1px solid var(--bg-tertiary);
        font-size: 12px;
      }

      .chain-item strong {
        display: block;
        color: var(--text-alternate);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 5px 4px;
        border-top: 1px solid var(--bg-tertiary);
        font-size: 12px;
        text-align: left;
      }

      td select {
        width: 100%;
        max-width: none;
        padding: 4px 6px;
        font-size: 12px;
      }

      .legacy-option {
        display: none;
      }

      @media (max-width: 900px) {
        #toolbar,
        #procedural-controls,
        #skeleton-adjust-panel,
        #map-panel,
        #chain-panel,
        #status {
          left: 10px;
          right: 10px;
          width: auto;
          max-width: none;
        }

        #toolbar {
          top: calc(var(--navigation-height) + 0.75rem);
          max-height: 34vh;
        }

        #procedural-controls {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          bottom: 10px;
          max-height: 32vh;
          overflow-y: auto;
        }

        #map-panel,
        #skeleton-adjust-panel {
          top: calc(var(--navigation-height) + 0.75rem);
        }

        #chain-panel,
        #status {
          bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div style="display: inline-flex; align-items: center;">
        <a href="https://mesh2motion.org"><img src="./images/mesh2motion.svg" width="200" alt="Mesh2Motion"></a>
        <a href="/">Explore</a>
        <a href="/create.html">Use Your Model</a>
        <a href="/retarget/index.html">Use Your Rigged Model</a>
        <span class="active-nav-item">Generated Motion Lab</span>
      </div>
      <div style="display: inline-flex; align-items: center;">
        <a href="#" id="learn-link">Learn</a>
        <a href="#" id="attribution-link">Contributors</a>
        <a href="https://support.mesh2motion.org" target="_blank">ðŸ’—</a>
        <a href="https://github.com/scottpetrovic/mesh2motion-app" target="_blank">
          <img src="../images/github-white-icon.png" width="24" height="24" alt="GitHub">
        </a>
      </div>
    </nav>
    <div id="toolbar">
      <label class="file-button" for="custom-model-input">Open GLB</label>
      <input id="custom-model-input" type="file" accept=".glb,.gltf" hidden>
      <label><input id="skeleton" type="checkbox" checked> skeleton</label>
      <select id="animation-select"></select>
      <button id="play-animation" type="button">Play</button>
      <button id="procedural-walk" type="button">Procedural walk</button>
      <button id="procedural-trot" type="button">Trot</button>
      <button id="procedural-canter" type="button">Canter</button>
      <button id="procedural-gallop" type="button">Gallop</button>
      <button id="procedural-hop" type="button">Hop</button>
      <button id="procedural-idle" type="button">Procedural idle</button>
      <button id="head-turn" type="button">Head turn</button>
      <button id="octopus-squirt" type="button">Squirt away</button>
      <button id="stop-animation" type="button">Stop</button>
      <button id="save-motion" type="button">Save motion</button>
      <button id="swap-front-back" type="button">Swap front/back</button>
      <button id="reset-map" type="button">Reset map</button>
      <button id="assign-legs" type="button">Assign legs</button>
      <button id="auto-detect-legs" type="button">Auto-detect legs</button>
    </div>
    <div id="procedural-controls">
      <label>Speed <input id="proc-speed" type="range" min="0.1" max="2" step="0.05" value="0.9"></label>
      <label>Stride <input id="proc-stride" type="range" min="0" max="1.2" step="0.02" value="0.48"></label>
      <label>Knee <input id="proc-knee" type="range" min="0" max="1.2" step="0.02" value="0.36"></label>
      <label>Lift <input id="proc-lift" type="range" min="0" max="0.8" step="0.02" value="0.25"></label>
      <label>Bob <input id="proc-bob" type="range" min="0" max="0.08" step="0.002" value="0.008"></label>
      <label>Target
        <select id="motion-focus">
          <option value="all">All</option>
          <option value="body">Body</option>
          <option value="head">Head</option>
          <option value="tail">Tail</option>
          <option value="legs">Legs</option>
          <option value="tentacles">Tentacles</option>
          <option value="tips">Tips</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
        </select>
      </label>
      <label>Jiggle <input id="motion-jiggle-amount" type="range" min="0" max="1.2" step="0.02" value="0.18"></label>
      <label>Rate <input id="motion-jiggle-frequency" type="range" min="0.2" max="4" step="0.05" value="1.4"></label>
      <label>Sway <input id="motion-sway" type="range" min="0" max="1.2" step="0.02" value="0"></label>
      <label>Twist <input id="motion-twist" type="range" min="0" max="1.2" step="0.02" value="0"></label>
    </div>
    <div id="skeleton-adjust-panel" hidden>
      <h2>Adjust Bone: <span id="selected-bone-label"></span></h2>
      <label>Rot X <input id="bone-rx" type="number" step="1"></label>
      <label>Rot Y <input id="bone-ry" type="number" step="1"></label>
      <label>Rot Z <input id="bone-rz" type="number" step="1"></label>
      <label>Pos X <input id="bone-px" type="number" step="0.005"></label>
      <label>Pos Y <input id="bone-py" type="number" step="0.005"></label>
      <label>Pos Z <input id="bone-pz" type="number" step="0.005"></label>
      <button id="reset-bone" type="button">Reset selected bone</button>
    </div>
    <div id="map-panel">
      <h2>Generated Bone Map</h2>
      <table>
        <thead>
          <tr>
            <th>Generated</th>
            <th id="mapping-source-header">Wolf source</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="mapping-table"></tbody>
      </table>
    </div>
    <div id="chain-panel">
      <h2>Procedural Chains</h2>
      <div id="chain-list"></div>
    </div>
    <div id="status">Loading animal...</div>
    <div id="bone-tooltip"></div>
    <script>
      if (window.location.protocol === 'file:') {
        document.querySelector('#status').textContent = 'Open this through Vite: http://192.168.1.180:5173/generated-motion.html'
      }
    </script>
    <script type="module" src="/lion-viewer.ts"></script>
  </body>
</html>
